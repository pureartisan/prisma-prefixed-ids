name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ # v4.2.2
      - uses: actions/dependency-review-action@ # v5.0.0
        with:
          fail-on-severity: high
